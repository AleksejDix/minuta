# Fast checks on the staged files only; the whole-project checks run on push.
# CI runs everything again and stays the source of truth.

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,mjs,vue,json,md,css,html,yml,yaml}"
      exclude:
        - "package-lock.json"
        - "CHANGELOG.md"
      run: npx oxfmt --check {staged_files}

    - name: lint
      glob: "*.{ts,tsx,js,mjs,vue}"
      run: npx oxlint {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: type-check
      run: npm run type-check

    - name: knip
      run: npm run knip

    - name: test
      run: npm test
