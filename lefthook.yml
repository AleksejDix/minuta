# Fast checks on the staged files only; the whole-project checks run on push.
# CI runs everything again and stays the source of truth.

pre-commit:
  parallel: true
  jobs:
    # Formatting is always safe to apply, so it is fixed and staged; the
    # docs pages are .mdx
    - name: format
      glob: "*.{ts,tsx,js,mjs,vue,json,md,mdx,css,html,yml,yaml}"
      exclude:
        - "package-lock.json"
        - "CHANGELOG.md"
      run: npx oxfmt {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{ts,tsx,js,mjs,vue}"
      run: npx oxlint {staged_files}

    # CI installs from the public registry only, so tarballs a private mirror
    # (e.g. Artifactory) wrote into the lockfile are pointed back at npmjs
    - name: lockfile-registry
      glob: "package-lock.json"
      run: node scripts/npmjs-lockfile.ts
      stage_fixed: true

# Conventional Commits, as .commitlintrc.json defines them; CI checks every
# commit of a pull request again
commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: type-check
      run: npm run type-check

    - name: knip
      run: npm run knip

    - name: test
      run: npm test
