name: CI

on:
  # Every pull request, so stacked PRs are checked before they reach master
  pull_request:
  push:
    branches: [master]

# Tests read the packages' sources through the @minuta/source export
# condition, so they do not wait for the build
jobs:
  commits:
    name: Commit messages
    # Every commit a pull request adds; local hooks can be skipped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check Conventional Commits
        run: >-
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build all packages
        run: npm run build --workspaces --if-present

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: packages/*/dist/
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Type-aware lint checks test files outside any tsconfig, so their imports
    # of other packages resolve to the built types
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: packages/

      # Type-aware lint rules read astro:content's types, which Astro generates
      - name: Generate Astro types
        run: npm run sync -w minuta-docs

      - name: Run linter
        run: npm run lint

  package-lint:
    name: Package Lint
    runs-on: ubuntu-latest
    # publint checks the packed packages: exports, types, files; then every
    # entry point is imported in plain Node, as server-side users would
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: packages/

      - name: Run publint
        run: npm run lint:packages

      - name: Import every entry point in plain Node
        run: npm run check:node-esm

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # input-dom and minuta-react run their tests in real browsers
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run tests
        run: npm test
        env:
          TZ: Europe/Zurich

  # Only the packages that compute in the computer's zone; the rest run once above
  test-time-zones:
    name: Test (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz:
          [
            UTC,
            America/New_York,
            Asia/Tokyo,
            America/Santiago,
            Pacific/Apia,
            Australia/Lord_Howe,
            Asia/Kathmandu,
          ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run date tests
        run: npx vitest run --project minuta --project datefield
        env:
          TZ: ${{ matrix.tz }}

  # minuta-react supports React 18 and 19; the jobs above run on 18
  test-react-19:
    name: Test (React 19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install React 19
        run: >-
          npm install --no-save -w packages/minuta-react
          react@19 react-dom@19 @types/react@19 @types/react-dom@19

      - name: Type check
        run: npm run type-check -w packages/minuta-react

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run tests
        run: npx vitest run --project "minuta-react (*)"
        env:
          TZ: Europe/Zurich

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: packages/

      - name: Run type checking
        run: npm run type-check

  size:
    name: Bundle Size
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: packages/

      - name: Check bundle sizes
        run: npm run size -w packages/minuta -w packages/fechita
