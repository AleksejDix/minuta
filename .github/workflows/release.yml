name: Release

# A version tag publishes every package to GitHub Packages, under the
# @aleksejdix scope, with the repository's own token: no secret to keep.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@aleksejdix"

      - run: npm ci

      - run: npm test
        env:
          TZ: UTC

      - run: npm run build --workspaces --if-present

      # In dependency order: each package's own packages are published first.
      - name: Publish
        run: |
          for package in text-buffer input-state datefield input-dom fechita minuta minuta-vue minuta-react; do
            npm publish -w "@aleksejdix/$package"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
