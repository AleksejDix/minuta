name: Release

# A version tag publishes every package to GitHub Packages, under the
# @aleksejdix scope, with the repository's own token: no secret to keep.
on:
  push:
    tags:
      - "v*"
  # By hand, on master, to finish a release that stopped part way: it
  # publishes only the versions not published yet.
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, such as v1.0.0-beta.1"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@aleksejdix"

      - run: npm ci

      # input-dom and minuta-react run their tests in real browsers. An
      # install that hangs (it has) fails the release instead of holding it.
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
        timeout-minutes: 10

      - run: npm test
        env:
          TZ: UTC

      - run: npm run build --workspaces --if-present

      # In dependency order: each package's own packages are published first.
      # A version already published is skipped, so a run that stopped part
      # way can run again. npm puts a prerelease (1.0.0-beta.1) under `next`,
      # never `latest`, and refuses one without a tag.
      - name: Publish
        run: |
          for package in text-buffer input-state datefield input-dom fechita minuta minuta-vue minuta-react; do
            name="@aleksejdix/$package"
            version=$(node -p "require('./packages/$package/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is published already"
              continue
            fi
            case "$version" in
              *-*) tag=next ;;
              *) tag=latest ;;
            esac
            npm publish -w "$name" --tag "$tag"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
